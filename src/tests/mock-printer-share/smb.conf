# A Windows computer sharing its USB printers for the e2e tests, see the mock-printer-share service of
# docker/docker-compose.test.yml. Each job is saved as it arrives, which is what Windows passes to a RAW printer
[global]
  server role = standalone server
  server min protocol = SMB3
  map to guest = never
  load printers = no
  printcap name = /dev/null
  disable spoolss = yes
  printing = bsd
  log level = 1
  # Samba replaces every %, so the script written by start.sh names the job: %s is the spooled file, %p the share
  print command = /usr/local/bin/save-job %s %p
  lpq command = /bin/true
  lprm command = /bin/true

[labels]
  path = /var/spool/samba
  printable = yes
  valid users = printer

[laser]
  path = /var/spool/samba
  printable = yes
  valid users = printer
