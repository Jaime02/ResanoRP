name: E2E tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Each shard runs on its own runner with its own stack, so the tests sharing one database is not a problem
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      # Created before Docker does, otherwise the bind mounts leave them owned by root
      - run: mkdir -p envs/test/caddy

      # The app container copies the mock data as root keeping its permissions, so the tests could not reset those copies
      - run: chmod -R a+rwX src/tests/mock-data

      # Runs a bundle, built in development mode, instead of the dev server, which loads every module on each navigation.
      # Playwright reuses this stack instead of starting its own webServer.
      - run: docker compose -p resanorp-test --project-directory . -f docker/docker-compose.base.yml -f docker/docker-compose.test.yml -f docker/docker-compose.test-production.yml --env-file ./envs/.env.test --profile test up -d --wait

      - run: bun --env-file=./envs/.env.test ./src/scripts/wait-for-url.ts

      # Caddy, running as root, creates its authority with permissions the tests, which trust its root certificate, cannot read
      - run: sudo chmod -R a+rX envs/test/caddy

      - run: node --env-file=./envs/.env.test ./node_modules/@playwright/test/cli.js test --shard=${{ matrix.shard }}/3 --reporter=line,blob --trace retain-on-failure

      - if: success()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/

      - if: failure()
        run: docker compose -p resanorp-test --project-directory . -f docker/docker-compose.base.yml -f docker/docker-compose.test.yml -f docker/docker-compose.test-production.yml --env-file ./envs/.env.test --profile test logs app-test powersync

  # Each shard only sees a part of the tests, so what they all saw written is compared with the meta of the mutations here.
  # The audit reporter goes first, so that the line reporter prints the error it throws
  audit-tables:
    needs: e2e
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - run: node ./node_modules/@playwright/test/cli.js merge-reports --reporter=./src/tests/utils/audit-tables-reporter.ts,line all-blob-reports
