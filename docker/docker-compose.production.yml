services:
  caddy:
    profiles: ["production"]
    depends_on:
      app-production:
        condition: service_healthy
  app-production:
    extends:
      service: app
      file: docker/docker-compose.base.yml
    container_name: app-production
    build:
      context: .
      target: production
    image: resanorp-app:production
    profiles: ["production"]
    env_file: "./envs/.env.production"
    networks:
      frontend:
        aliases:
          - app
    volumes:
      - ./envs/production:/env
    environment:
      - PORT=5173
    command: bun run .output/server/index.mjs
